version: 2

builds:
  - binary: go-bind-plugin
    env:
      # Release binaries are cgo-free: source-based analysis (-plugin-package)
      # is fully supported; loading a plugin (.so-only mode) requires a binary
      # built with the same toolchain as the plugin — use go install for that.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
