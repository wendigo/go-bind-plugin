name: CI

on:
  push:
    branches: [master]
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # -buildmode=plugin is only supported on Linux and macOS
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l . | grep -v generated || true)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'ed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -coverprofile=coverage.out ./cli

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
